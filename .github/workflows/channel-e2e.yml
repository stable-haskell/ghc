# Channel end-to-end CI.
#
# Validates the SHIPPED wasm cross-compiler + cabal + ghcup channel YAML
# by exercising the exact flow an end-user does:
#   1. install ghcup fresh
#   2. add the stable-haskell ghcup channel
#   3. ghcup install ghc / ghcup install cabal
#   4. build the published example templates (hello + miso-counter)
#
# This closes a gap left by `Cross: WASM` in nix-ci.yml — those jobs
# validate the compiler in-tree (`_build/dist/bin/wasm32-unknown-wasi-ghc`)
# from the active checkout, not the published ghcup-installed bundle that
# real users actually get. Concretely, this catches:
#   * channel YAML schema breakage
#   * dlUri / dlHash mismatches (e.g. asset re-uploaded with different bytes)
#   * relocate.sh / post-install hook regressions on a fresh install prefix
#   * dual-compiler regressions in the shipped `cabal`
#   * TH-heavy build regressions at scale (the miso template — 50+ deps
#     incl. aeson, lens, jsaddle, jsaddle-wasm, miso)
#
# Runs on:
#   * github-hosted ubuntu-latest    (x86_64-linux)
#   * github-hosted ubuntu-24.04-arm (aarch64-linux)
#   * self-hosted darwin             (aarch64-darwin)
#
# We avoid the github-hosted macos-14 runners (10x billing rate even on
# public repos) and instead use the org's own aarch64-darwin Tart VMs.
# These VMs DO have devx pre-imported in /nix/store, but the test never
# enters devx — it installs ghcup vanilla and exercises the channel YAML
# end-to-end. The pre-baked nix-store is irrelevant to the test surface.
name: Channel e2e

on:
  push:
    tags: [wasm32-wasi-*]      # new GHC release → re-test
  pull_request:
    # validate workflow changes themselves end-to-end before merge
    paths: ['.github/workflows/channel-e2e.yml']
  workflow_dispatch:
    inputs:
      wasm_version:
        description: 'GHC wasm version to test (e.g. wasm32-wasi-9.14.0.stable.12)'
        default: ''
  # NOTE: cron only fires on the repo's default branch. Once this workflow
  # lands on `stable-ghc-9.14`, uncomment to add a weekly silent-regression
  # canary that catches drift (release asset re-uploaded, channel YAML
  # mis-deployed, NodeSource setup_22.x breaking, etc.):
  # schedule:
  #   - cron: '0 6 * * 1'      # Monday 06:00 UTC

# Only run one at a time per ref — avoids racing on cabal-store side effects
# when the cron and a manual dispatch happen close together.
concurrency:
  group: channel-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-build:
    name: e2e / ${{ matrix.plat }}
    # matrix.runner is a JSON-string ARRAY of labels: '["label1", "label2"]'
    # so both github-hosted ("ubuntu-latest") and label-matched self-hosted
    # ("self-hosted", "macos", ...) targeting work through one knob.
    runs-on: ${{ fromJSON(matrix.runner) }}
    # 60min: aarch64-linux took 30min to build through aeson/lens/jsaddle
    # for the miso template; miso itself is sizeable, and ubuntu-24.04-arm
    # is meaningfully slower than ubuntu-latest. 30min hit timeout right
    # before miso started compiling. x86_64-linux fits comfortably in 30
    # min so this only adds slack for the slow runner.
    timeout-minutes: 60
    # darwin currently expected-failing — Tart base lacks Xcode CLT and
    # CLT install needs 11.8 GB that the APFS container doesn't have
    # spare. continue-on-error so darwin job stays visible (and tells us
    # when the Tart base image gets CLT) without failing the overall run.
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: x86_64-linux,   runner: '["ubuntu-latest"]'                                  }
          - { plat: aarch64-linux,  runner: '["ubuntu-24.04-arm"]'                               }
          - { plat: aarch64-darwin, runner: '["self-hosted", "macos", "arm64", "nix"]', allow-failure: true }

    env:
      # Default is the current LatestPrerelease; workflow_dispatch can override.
      # Push events (tag wasm32-wasi-*) leave inputs empty → fall back to default.
      WASM_VER:  ${{ inputs.wasm_version != '' && inputs.wasm_version || 'wasm32-wasi-9.14.0.stable.12' }}
      CABAL_VER: 3.17.0.0.stable.0

    steps:
      # ---------------------------------------------------------------------
      # 1. ghcup itself — fresh install. We DON'T use the pre-installed ghcup
      #    on github-hosted runners; this validates the official installer
      #    works as documented in the README and landing page.
      #
      #    Two ghcup-runner-image quirks to work around:
      #      * /usr/local/.ghcup pre-baked, root-owned → set
      #        GHCUP_INSTALL_BASE_PREFIX="$HOME" so install lands in ~/.ghcup.
      #      * $HOME/.ghcup ALSO pre-baked on some images, owned root-ish →
      #        wipe it first so the installer's chmod +x has clean ground.
      #
      #    MINIMAL=1 skips the auto-install of latest GHC/cabal; the channel
      #    YAML installs the stable-haskell variants we actually want.
      # ---------------------------------------------------------------------
      - name: Install ghcup fresh
        run: |
          set -euo pipefail
          # Wipe pre-baked ghcup locations. github-hosted ubuntu runners
          # ship /usr/local/.ghcup (root-owned); self-hosted darwin Tart
          # VMs typically don't, so the sudo path runs only on Linux. The
          # $HOME/.ghcup wipe is unconditional (cheap, no-op if absent).
          rm -rf "$HOME/.ghcup"
          if [ "$(uname -s)" = "Linux" ] && [ -d /usr/local/.ghcup ]; then
            sudo rm -rf /usr/local/.ghcup
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org \
            | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 \
              BOOTSTRAP_HASKELL_MINIMAL=1 \
              GHCUP_INSTALL_BASE_PREFIX="$HOME" \
              sh
          echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"
          # Belt-and-suspenders: persist this for every subsequent step so
          # ghcup's own re-derivation of its base prefix doesn't drift.
          echo "GHCUP_INSTALL_BASE_PREFIX=$HOME" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # 2. System tools: gcc (cabal needs it for the dual-compiler build's
      #    native side — Setup.hs compiles + FFI cbits) and Node 22.
      #
      #    Ubuntu noble's apt nodejs is 18.19.1, but post-link.mjs uses
      #    `import.meta.filename` (added Node 20.11). On Node 18 the
      #    post-link step silently exits without writing the .mjs glue,
      #    breaking subsequent JSFFI runs. NodeSource setup_22.x is the
      #    canonical fix.
      # ---------------------------------------------------------------------
      - name: Install gcc + Node 22 (Linux via apt + NodeSource)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y --no-install-recommends nodejs
          gcc --version | head -1
          # ubuntu-24.04-arm pre-bakes Node 20 in /opt/hostedtoolcache and
          # adds it to PATH ahead of /usr/bin. That means even after we
          # apt-install Node 22 to /usr/bin/node, `node` resolves to the
          # toolcache v20 — which then runs dyld.mjs under a Node release
          # that lacks features Node 22 introduced (stream.toWeb flow
          # control over experimental .toWeb()), causing miso TH builds
          # to deadlock against wasm-iserv.
          # See aarch64-linux miso hang investigation (run 26700668292,
          # logged v20.20.0 on aarch64 vs v22.22.3 on x86_64 with the
          # same workflow).
          # Force /usr/bin first so the NodeSource Node 22 binary wins.
          echo "/usr/bin" >> "$GITHUB_PATH"
          export PATH="/usr/bin:$PATH"
          which node
          node --version
          # Assert Node 22+ — fail loud if the toolcache still shadows.
          ver=$(node --version | tr -d v | cut -d. -f1)
          test "$ver" -ge 22 || { echo "::error::expected Node 22+, got $(node --version)"; exit 1; }

      # Darwin: Tart self-hosted VMs ship without Xcode CLT, which means
      # nix can't build derivations that pull in stdenv (it needs clang).
      # Empirically `nix-env -iA nixpkgs.nodejs_22` had to build the
      # full nodejs.drv + user-environment.drv and failed with:
      #   xcode-select: note: No developer tools were found, requesting install.
      #
      # Download the official nodejs.org darwin-arm64 tarball directly —
      # hermetic, no toolchain build required, matches what an end-user
      # who just installed Node would have.
      - name: Install Node 22 + clang (Darwin)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          NODE_VER=v22.22.0
          NODE_DIR="$HOME/node-$NODE_VER"
          rm -rf "$NODE_DIR"
          curl -fsSL "https://nodejs.org/dist/$NODE_VER/node-$NODE_VER-darwin-arm64.tar.xz" \
            | tar -xJ -C "$HOME"
          mv "$HOME/node-$NODE_VER-darwin-arm64" "$NODE_DIR"
          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"
          "$NODE_DIR/bin/node" --version

          # clang: Tart base sometimes ships /Library/Developer/CommandLineTools
          # but with xcode-select not pointing at it (or with /usr/bin/clang
          # as a stub that triggers a GUI install prompt). Diagnose + fix.
          echo "=== xcode-select / CLT state ==="
          sudo xcode-select -p 2>&1 || true
          ls /Library/Developer/CommandLineTools/usr/bin/clang 2>&1 || true
          if [ -x /Library/Developer/CommandLineTools/usr/bin/clang ]; then
            # CLT is present, just not selected — point xcode-select at it.
            sudo xcode-select -s /Library/Developer/CommandLineTools 2>&1 || true
            echo "=== After xcode-select -s ==="
            sudo xcode-select -p
          fi
          # Make /usr/bin/clang actually work (it's a stub that calls xcrun)
          if ! /usr/bin/clang --version >/dev/null 2>&1; then
            echo "::warning::clang still not functional after xcode-select. Trying CLT install via softwareupdate (non-interactive)."
            # Trigger non-interactive CLT install.
            sudo touch /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
            label=$(softwareupdate --list 2>&1 \
              | grep -oE '\* Label: Command Line Tools.*' \
              | sed 's/^\* Label: //' \
              | tail -1) || true
            if [ -n "$label" ]; then
              echo "Found CLT label: $label"
              sudo softwareupdate -i "$label" --no-scan --verbose || true
            else
              echo "::error::no Command Line Tools label found in softwareupdate --list"
              sudo rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
              exit 1
            fi
            sudo rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
          fi
          /usr/bin/clang --version | head -1

      # ---------------------------------------------------------------------
      # 3a. Install a native GHC for the dual-compiler build. The hello
      #     and miso templates' cabal.project sets
      #         with-build-compiler: ghc
      #         with-compiler:       wasm32-unknown-wasi-ghc
      #     so we need both a native `ghc` (for Setup.hs + Template Haskell
      #     host evaluation) and the wasm cross-compiler. An end-user
      #     following our install docs would do `ghcup install ghc recommended`
      #     before working on a project; replicate that here.
      # ---------------------------------------------------------------------
      - name: Install native GHC (recommended) for Setup.hs + TH host
        run: |
          set -euo pipefail
          ghcup install ghc recommended
          ghcup set    ghc recommended
          ghc --version

      # ---------------------------------------------------------------------
      # 3b. Add the stable-haskell channel + install the wasm cross-compiler.
      #     The channel URL is the LIVE one — this test fails if gh-pages
      #     is mis-deployed or the release assets aren't yet uploaded.
      # ---------------------------------------------------------------------
      - name: Add stable-haskell channel + install wasm GHC
        run: |
          set -euo pipefail
          ghcup --version
          ghcup config add-release-channel \
            https://stable-haskell.github.io/ghc/ghcup-wasm.yaml
          ghcup install ghc "$WASM_VER"
          # Put the cross-compiler on PATH for subsequent steps.
          echo "$HOME/.ghcup/ghc/$WASM_VER/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------------
      # 3c. Install wasi-sdk. The wasm GHC's `settings` file declares
      #     `C compiler command = wasm32-unknown-wasi-clang`. That binary
      #     ships in wasi-sdk, NOT in our channel (intentionally — wasi-sdk
      #     pinning is ghc-wasm-meta's domain). End users need it too.
      #
      #     ghc-wasm-meta's bootstrap.sh extracts wasi-sdk under
      #     $HOME/.ghc-wasm/wasi-sdk/. We also create wasm32-unknown-wasi-*
      #     symlinks because the wasi-sdk bindist ships the binaries with
      #     `wasm32-wasi-` prefix while autoconf's canonical triple (which
      #     ghc-toolchain-bin baked into the wasm GHC settings) is
      #     `wasm32-unknown-wasi-`.
      # ---------------------------------------------------------------------
      - name: Install wasi-sdk via ghc-wasm-meta bootstrap
        run: |
          set -euo pipefail
          export TMPDIR="$GITHUB_WORKSPACE/_tmp"
          mkdir -p "$TMPDIR"
          curl -fsSL https://gitlab.haskell.org/ghc/ghc-wasm-meta/-/raw/master/bootstrap.sh | \
            FLAVOUR=9.12 PREFIX=$HOME/.ghc-wasm sh
          WASI_BIN="$HOME/.ghc-wasm/wasi-sdk/bin"
          test -d "$WASI_BIN" || { echo "::error::$WASI_BIN missing — bootstrap.sh layout changed?"; exit 1; }
          # Bridge the prefix mismatch — wasi-sdk ships wasm32-wasi-clang,
          # the wasm GHC settings expects wasm32-unknown-wasi-clang.
          for tool in clang clang++; do
            ln -sf "$WASI_BIN/wasm32-wasi-$tool" "$WASI_BIN/wasm32-unknown-wasi-$tool"
          done
          # llvm-{ar,nm,ranlib,strip} are wrapped under the canonical triple
          # too, in case the wasm GHC settings file references any of them.
          for tool in ar nm ranlib strip; do
            ln -sf "$WASI_BIN/llvm-$tool" "$WASI_BIN/wasm32-unknown-wasi-$tool" 2>/dev/null || true
          done
          echo "$WASI_BIN" >> "$GITHUB_PATH"
          ls "$WASI_BIN" | grep -E "wasm32-unknown-wasi-(clang|ar|nm|ranlib|strip)" | head -10

      # ---------------------------------------------------------------------
      # 3c. Install cabal from the channel. Should succeed on every platform
      #     we test (channel was extended with Linux variants in stable.1).
      # ---------------------------------------------------------------------
      - name: Install cabal
        id: cabal
        run: |
          set -euo pipefail
          if ! ghcup install cabal "$CABAL_VER" 2>&1 | tee /tmp/cabal-install.log; then
            if grep -q "Unable to find a download for Tool" /tmp/cabal-install.log; then
              echo "::warning::cabal-$CABAL_VER not yet available for this platform"
              echo "cabal_installed=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              exit 1
            fi
          fi
          ghcup set cabal "$CABAL_VER"
          echo "cabal_installed=true" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # 4. Sanity: verify the cabal binary and a standalone single-compiler
      #    build pass — confirms the stable-haskell cabal-install binary itself
      #    is healthy, the channel YAML is correct, and dependency lookup
      #    (gcc / pkg-config / ghc) all work in the basic case.
      # ---------------------------------------------------------------------
      - name: Sanity — single-compiler cabal build
        if: steps.cabal.outputs.cabal_installed == 'true'
        run: |
          set -euo pipefail
          cabal --version
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > probe.cabal <<'EOF'
          cabal-version: 3.0
          name:          probe
          version:       0.1
          executable probe
            main-is:        Main.hs
            build-depends:  base
            default-language: Haskell2010
          EOF
          echo 'main = putStrLn "ok"' > Main.hs
          cat > cabal.project <<'EOF'
          packages: .
          with-build-compiler: ghc
          with-build-hc-pkg:   ghc-pkg
          EOF
          cabal update
          cabal build
          cabal run -v0 probe | tee /tmp/probe-out
          grep -q '^ok$' /tmp/probe-out

      # ---------------------------------------------------------------------
      # 5. Smoke test — hello template. ~30 s build, runs via node:wasi
      #    and prints "Hello from the WASM reactor!" — covers reactor
      #    bring-up + ghc_wasm_jsffi_init + hs_start sequence.
      # ---------------------------------------------------------------------
      - name: hello template — build + run-node
        if: steps.cabal.outputs.cabal_installed == 'true'
        run: |
          set -euo pipefail
          curl -fL -o hello.tar.gz \
            https://stable-haskell.github.io/ghc/examples/stable-haskell-wasm-hello.tar.gz
          tar xf hello.tar.gz
          cd stable-haskell-wasm-hello
          # The published template's Makefile bakes WASM_VERSION=stable.0 (it
          # was packaged before stable.1/.2 shipped). Override on the
          # command line so post-link.mjs resolves under our $WASM_VER prefix.
          make WASM_VERSION="$WASM_VER" build
          # Use tee so we see the output even when run-node exits non-zero;
          # `out=$(...)` + set -e would swallow it.
          make WASM_VERSION="$WASM_VER" run-node 2>&1 | tee /tmp/run-node.out
          grep -q 'Hello from the WASM reactor!' /tmp/run-node.out \
            || { echo "::error::expected 'Hello from the WASM reactor!' in run-node output"; exit 1; }

      # ---------------------------------------------------------------------
      # 6. Real-world test — miso-counter template. 50+ TH-heavy deps.
      #    First build ~5-10 min on a clean cabal store. Verifies the full
      #    dyld + JSFFI link chain works at scale. Skip the run-web step
      #    (needs a browser); just check the .wasm artifact exists and is
      #    a valid WebAssembly module — sufficient to catch link-level
      #    regressions.
      # ---------------------------------------------------------------------
      - name: miso-counter template — build + verify wasm artifact
        if: steps.cabal.outputs.cabal_installed == 'true'
        run: |
          set -euo pipefail
          curl -fL -o miso.tar.gz \
            https://stable-haskell.github.io/ghc/examples/stable-haskell-wasm-miso-counter.tar.gz
          tar xf miso.tar.gz
          cd stable-haskell-wasm-miso-counter

          # ------------------------------------------------------------------
          # Diagnostic monitor — captures process + memory state every 60s
          # during the miso build, so when (if) the build hangs we know
          # WHICH process is stuck and HOW (sleeping vs spinning, memory
          # footprint, child relationships).
          #
          # Triggered by the aarch64-linux miso hang in stable.12's first
          # e2e attempt (run 26700668292): jsaddle-wasm completed, then 47
          # minutes of silence before timeout. Need module-level + process-
          # level visibility to diagnose.
          # ------------------------------------------------------------------
          (
            while true; do
              echo "::group::diag $(date +%H:%M:%S)"
              echo "--- ps (wasm/ghc/cabal/node) ---"
              if [ "$(uname -s)" = "Darwin" ]; then
                ps -A -o pid,ppid,%cpu,%mem,rss,etime,stat,comm,command 2>/dev/null \
                  | head -1
                ps -A -o pid,ppid,%cpu,%mem,rss,etime,stat,comm,command 2>/dev/null \
                  | grep -E "(ghc|cabal|node|wasm32|iserv)" | grep -v grep || true
                echo "--- memory ---"
                vm_stat | head -10
              else
                ps -e -o pid,ppid,%cpu,%mem,rss,etime,stat,comm,command 2>/dev/null \
                  | head -1
                ps -e -o pid,ppid,%cpu,%mem,rss,etime,stat,comm,command 2>/dev/null \
                  | grep -E "(ghc|cabal|node|wasm32|iserv)" | grep -v grep || true
                echo "--- memory ---"
                free -h 2>/dev/null
              fi
              echo "::endgroup::"
              sleep 60
            done
          ) &
          MONITOR_PID=$!
          # Make sure the monitor goes down with the step, regardless of
          # success/failure/cancellation. The cancellation case relies on
          # GitHub sending SIGTERM to our shell, which propagates via
          # default trap behavior — explicit trap is belt-and-suspenders.
          trap 'kill $MONITOR_PID 2>/dev/null || true' EXIT INT TERM

          # Same WASM_VERSION override as the hello step.
          make WASM_VERSION="$WASM_VER" build
          wasm_file=$(find dist-newstyle -name 'myapp.wasm' -type f | head -1)
          test -n "$wasm_file" || { echo "::error::myapp.wasm not produced"; exit 1; }
          ls -lh "$wasm_file"
          file "$wasm_file" | tee /tmp/file_out
          grep -q 'WebAssembly' /tmp/file_out \
            || { echo "::error::artifact is not a wasm binary"; exit 1; }
