name: Focused Intel T26537 comparison

on:
  push:
    branches: [diagnose/t26537-intel]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: macOS-15-intel
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record the common runner and toolchain
        run: |
          test "$(uname -m)" = x86_64
          test -d "$DEVELOPER_DIR"
          sw_vers
          sysctl machdep.cpu.brand_string hw.logicalcpu hw.memsize
          xcrun --find clang
          xcrun clang --version
          python3 --version
      - name: Download final PR 196 Intel compiler
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '11986008507'
          merge-multiple: true
          run-id: '38730232981'
          github-token: ${{ github.token }}
          path: _build/t26537-input/196
      - name: Download final PR 197 Intel compiler
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '11990188469'
          merge-multiple: true
          run-id: '38730229809'
          github-token: ${{ github.token }}
          path: _build/t26537-input/197
      - name: Extract native compilers and identical test fixtures only
        run: |
          shopt -s nullglob
          for pr in 196 197; do
            archive_dir="_build/t26537-input/$pr"
            prefix="_build/t26537-prefix/$pr"
            # The release workflow adds the version and platform before upload.
            # Require exactly one native compiler; exclude the JavaScript one.
            ghc_archives=("$archive_dir"/ghc-[0-9]*-x86_64-apple-darwin.tar.gz)
            tests_archives=("$archive_dir"/tests-x86_64-apple-darwin.tar.gz)
            test "${#ghc_archives[@]}" -eq 1
            test "${#tests_archives[@]}" -eq 1
            printf 'PR %s: %s and %s\n' "$pr" "${ghc_archives[0]}" "${tests_archives[0]}"
            mkdir -p "$prefix"
            tar -xzf "${ghc_archives[0]}" -C "$prefix"
            tar -xzf "${tests_archives[0]}" -C "$prefix" \
              testsuite/tests/codeGen/should_run/T26537.hs \
              testsuite/tests/codeGen/should_run/T26537.stdout \
              testsuite/tests/codeGen/should_run/all.T
            # These directories contain only this job's downloaded archives.
            rm -f "$archive_dir"/*.tar.gz
          done
      - name: Compare one clean compilation per compiler, preserving limits
        run: |
          python3 .github/scripts/compare-t26537.py \
            --baseline _build/t26537-prefix/196 \
            --candidate _build/t26537-prefix/197 \
            --output _build/t26537-results --timings
      - name: Preserve phase timings, commands, and golden-output checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t26537-intel-comparison
          retention-days: 3
          if-no-files-found: warn
          path: _build/t26537-results/
