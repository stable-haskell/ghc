name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [stable-ghc-9.14, stable-ghc-9.14-rebased, stable-master]
  workflow_dispatch:
    inputs:
      qualification:
        description: Select the full workflow or one focused native platform qualification
        required: true
        type: choice
        options:
          - full
          - linux-native
          - windows-native
        default: full

env:
  CABAL_CACHE_PATH: _build/cabal/bin

jobs:
  cabal:
    if: ${{ inputs.qualification != 'windows-native' }}
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ fromJSON(inputs.qualification == 'linux-native' && '["x86_64-linux"]' || '["x86_64-linux","aarch64-darwin"]') }}
        dynamic: ${{ fromJSON(inputs.qualification == 'linux-native' && '[0]' || '[0,1]') }}
        ghc: ['98']
        # aarch64-linux remains disabled while its devx image is unavailable.

    name: "${{ matrix.plat }} / ghc ${{ matrix.ghc }} / dynamic=${{ matrix.dynamic }}"
    runs-on: ${{ matrix.plat == 'x86_64-linux' && 'ubuntu-24.04' || 'macos-latest' }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - uses: input-output-hk/actions/devx@latest
      with:
        platform: ${{ matrix.plat }}
        compiler-nix-name: 'ghc98'
        minimal: true
        ghc: true

    - name: Cache stage0 cabal binary
      id: cabal-cache
      uses: actions/cache@v5
      with:
        path: ${{ env.CABAL_CACHE_PATH }}
        key: cabal-${{ vars.CACHE_VERSION || 'v1' }}-${{ matrix.plat }}-${{ hashFiles('cabal.project.stage0') }}

    - name: Prepare cabal directory
      run: |
        echo "CABAL_DIR=$GITHUB_WORKSPACE/_build/cabal-dir" >> "$GITHUB_ENV"
        rm -rf ~/.cabal/store ~/.cabal-devx/store ~/.cabal-devx/packages 2>/dev/null || true

    - name: Update hackage
      shell: devx {0}
      run: |
        set -eo pipefail
        export CABAL_DIR="$GITHUB_WORKSPACE/_build/cabal-dir"
        mkdir -p "$CABAL_DIR"
        cabal update

    # The Makefile will run configure (and boot), we also need to create a
    # synthetic package before running configure.  Once this nuisance is fixed
    # we can do proper configure + make again. Until then... we have to live
    # with the hack of running everything from the make target.
    # - name: Configure the build
    #   shell: devx {0}
    #   run: ./configure

    - name: Start metrics collection
      shell: bash  # bash (not devx): metrics tools use absolute paths to system binaries
      run: ./mk/collect-metrics.sh start _build/metrics 0.5

    - name: Build stage0 + stage1 (dynamic=${{ matrix.dynamic }})
      shell: devx {0}
      timeout-minutes: 45
      run: |
        set -eo pipefail
        export CABAL_DIR="$GITHUB_WORKSPACE/_build/cabal-dir"
        export TMPDIR="$GITHUB_WORKSPACE/_build/tmp"
        mkdir -p "$TMPDIR"
        make QUIET=1 DYNAMIC=${{ matrix.dynamic }} CABAL_ARGS="-j2" ${{ steps.cabal-cache.outputs.cache-hit == 'true' && 'USE_SYSTEM_CABAL=1' || '' }} stage1

    - name: Clean intermediates to free disk for stage2
      run: |
        GIT_COMMIT_ID=$(git rev-parse HEAD)
        echo "GIT_COMMIT_ID=$GIT_COMMIT_ID" >> "$GITHUB_ENV"
        rm -rf .git
        find . -name .git -type d -exec rm -rf {} + 2>/dev/null || true
        rm -rf _build/stage0/ 2>/dev/null || true
        find _build/stage1/ -maxdepth 1 -mindepth 1 -not -name store -exec rm -rf {} + 2>/dev/null || true
        rm -rf _build/packages/ _build/tmp/ 2>/dev/null || true
        rm -rf "${CABAL_DIR:-$GITHUB_WORKSPACE/_build/cabal-dir}/packages/" 2>/dev/null || true

    - name: Build stage2 (dynamic=${{ matrix.dynamic }})
      id: stage2_build
      shell: devx {0}
      timeout-minutes: 90
      run: |
        set -eo pipefail
        export CABAL_DIR="$GITHUB_WORKSPACE/_build/cabal-dir"
        export TMPDIR="$GITHUB_WORKSPACE/_build/tmp"
        mkdir -p "$TMPDIR"
        make QUIET=1 DYNAMIC=${{ matrix.dynamic }} CABAL_ARGS="-j2" USE_SYSTEM_CABAL=1 stage2

    - name: Run liblink native C units
      if: ${{ matrix.dynamic == 0 }}
      shell: devx {0}
      run: python3 liblink/tests/unit/run_native_tests.py

    - name: Run sanitized liblink C units
      if: ${{ matrix.dynamic == 0 && matrix.plat == 'x86_64-linux' }}
      shell: devx {0}
      timeout-minutes: 20
      run: |
        set -eo pipefail
        mkdir -p _build/logs
        python3 liblink/tests/unit/test_run_sanitized_tests.py 2>&1 | tee _build/logs/liblink-sanitized-driver.log
        ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          python3 liblink/tests/unit/run_sanitized_tests.py \
            --output-dir _build/liblink-sanitized \
            --timeout 900 --command-timeout 300 \
          2>&1 | tee _build/logs/liblink-sanitized.log

    - name: Upload liblink sanitizer results
      if: ${{ always() && matrix.dynamic == 0 && matrix.plat == 'x86_64-linux' }}
      uses: actions/upload-artifact@v4
      with:
        name: liblink-linux-sanitizer-results
        if-no-files-found: ignore
        path: |
          _build/liblink-sanitized/sanitized-run.json
          _build/logs/liblink-sanitized*.log

    - name: Display build timings
      if: ${{ !cancelled() }}
      shell: devx {0}
      run: make timing-summary

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.plat }}-dynamic${{ matrix.dynamic }}-dist
        path: _build/dist

    - name: Upload build logs and timing
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ${{ matrix.plat }}-dynamic${{ matrix.dynamic }}-build-logs
        path: |
          _build/logs/
          _build/timing/

    - name: Run the testsuite (dynamic=${{ matrix.dynamic }})
      if: ${{ inputs.qualification != 'linux-native' && inputs.qualification != 'windows-native' }}
      shell: devx {0}
      run: |
        set -eo pipefail
        export CABAL_DIR="$GITHUB_WORKSPACE/_build/cabal-dir"
        export TMPDIR="$GITHUB_WORKSPACE/_build/tmp"
        mkdir -p "$TMPDIR"
        make test QUIET=1 DYNAMIC=${{ matrix.dynamic }} USE_SYSTEM_CABAL=1 VERBOSE=3 2>&1 | tee _build/test-run.log

    - name: Collect unpacked sums phase timings
      if: ${{ !cancelled() && matrix.plat == 'aarch64-darwin' && steps.stage2_build.outcome == 'success' }}
      shell: devx {0}
      timeout-minutes: 20
      run: |
        set -eo pipefail
        mkdir -p _build/logs
        python3 .github/scripts/measure-unpack-sums.py \
          --ghc "$GITHUB_WORKSPACE/_build/dist/bin/ghc" \
          --output-dir "$GITHUB_WORKSPACE/_build/unpack-sums-timings" \
          2>&1 | tee _build/logs/unpack-sums-timings.log

    - name: Upload unpacked sums timing diagnostics
      if: ${{ !cancelled() && matrix.plat == 'aarch64-darwin' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.plat }}-dynamic${{ matrix.dynamic }}-unpack-sums-timings
        if-no-files-found: ignore
        path: |
          _build/unpack-sums-timings/
          _build/logs/unpack-sums-timings.log

    - name: Stop metrics collection
      if: ${{ !cancelled() }}
      shell: bash  # bash (not devx): metrics tools use absolute paths to system binaries
      run: ./mk/collect-metrics.sh stop _build/metrics

    - name: Display test timings
      if: ${{ !cancelled() }}
      shell: devx {0}
      run: make timing-summary

    - name: Generate metrics plots
      if: ${{ !cancelled() }}
      continue-on-error: true
      shell: bash
      run: |
        # Generate separate build and test SVG plots.
        # Use bash (not devx) because nix is not available inside the devx shell.
        PYTHON_MPL=$(nix build --impure --no-link --print-out-paths \
          --expr 'let pkgs = (builtins.getFlake "nixpkgs").legacyPackages.${builtins.currentSystem}; in pkgs.python3.withPackages (ps: [ps.matplotlib])')
        "$PYTHON_MPL/bin/python3" ./mk/plot-metrics.py _build/metrics _build/timing _build/metrics/metrics

    - name: Upload metrics plots to R2
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_METRICS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_METRICS_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_METRICS_ENDPOINT }}
        R2_PUBLIC_URL: ${{ vars.R2_METRICS_PUBLIC_URL }}
        R2_BUCKET: ${{ vars.R2_METRICS_BUCKET_NAME }}
      shell: bash
      run: |
        RUN_ID="${{ github.run_id }}"
        PLAT="${{ matrix.plat }}"
        DYN="${{ matrix.dynamic }}"

        export AWS_ENDPOINT_URL="${R2_ENDPOINT}"
        export AWS_DEFAULT_REGION=auto

        # Use bash (not devx) because nix is not available inside the devx shell.
        AWSCLI=$(nix build --no-link --print-out-paths nixpkgs#awscli2)
        AWS="$AWSCLI/bin/aws"

        # Upload build plot if it exists
        if [[ -f "_build/metrics/metrics-build.svg" ]]; then
          BUILD_PATH="runs/${RUN_ID}/${PLAT}-dynamic${DYN}-build.svg"
          "$AWS" s3 cp _build/metrics/metrics-build.svg "s3://${R2_BUCKET}/${BUILD_PATH}" --content-type 'image/svg+xml' || echo "Failed to upload build plot (non-fatal)"
          echo "BUILD_PLOT_URL=${R2_PUBLIC_URL}/${BUILD_PATH}" >> $GITHUB_ENV
        fi

        # Upload test plot if it exists
        if [[ -f "_build/metrics/metrics-test.svg" ]]; then
          TEST_PATH="runs/${RUN_ID}/${PLAT}-dynamic${DYN}-test.svg"
          "$AWS" s3 cp _build/metrics/metrics-test.svg "s3://${R2_BUCKET}/${TEST_PATH}" --content-type 'image/svg+xml' || echo "Failed to upload test plot (non-fatal)"
          echo "TEST_PLOT_URL=${R2_PUBLIC_URL}/${TEST_PATH}" >> $GITHUB_ENV
        fi

    - name: Write metrics summary
      if: ${{ !cancelled() }}
      shell: devx {0}
      run: |
        echo "## Build Metrics Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Embed build plot if available
        if [[ -n "${BUILD_PLOT_URL:-}" ]]; then
          echo "### Build Phases (CPU & Memory)" >> $GITHUB_STEP_SUMMARY
          echo "<img src=\"${BUILD_PLOT_URL}\" alt=\"Build Metrics\" width=\"100%\">" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Embed test plot if available
        if [[ -n "${TEST_PLOT_URL:-}" ]]; then
          echo "### Test Phase (CPU & Memory)" >> $GITHUB_STEP_SUMMARY
          echo "<img src=\"${TEST_PLOT_URL}\" alt=\"Test Metrics\" width=\"100%\">" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        echo "### Phase Timings" >> $GITHUB_STEP_SUMMARY
        echo "| Phase | Duration | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|----------|--------|" >> $GITHUB_STEP_SUMMARY

        # Auto-discover phases from timing files (summary.txt is generated
        # by timing-summary.sh with ordered top-level + sub-phases)
        make timing-summary 2>/dev/null || true
        if [[ -f "_build/timing/summary.txt" ]]; then
          while read -r phase dur status; do
            mins=$((dur / 60))
            secs=$((dur % 60))
            status_str="OK"
            [[ "$status" == "1" ]] && status_str="FAIL"
            # Indent sub-phases (contain a dot) with leading spaces
            if [[ "$phase" == *.* ]]; then
              echo "| &nbsp;&nbsp;$phase | ${mins}m ${secs}s | $status_str |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| **$phase** | **${mins}m ${secs}s** | $status_str |" >> $GITHUB_STEP_SUMMARY
            fi
          done < "_build/timing/summary.txt"
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        # Add memory stats from metrics
        if [[ -f "_build/metrics/metrics.csv" ]]; then
          max_mem=$(awk -F',' 'NR>1 {if($3>max) max=$3} END {printf "%.1f", max/1024}' _build/metrics/metrics.csv)
          echo "**Peak Memory:** ${max_mem} GB" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ${{ matrix.plat }}-dynamic${{ matrix.dynamic }}-testsuite-results
        path: |
          _build/test-perf.csv
          _build/test-summary.txt
          _build/test-junit.xml
          _build/test-run.log
          _build/timing/

    - name: Upload metrics
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ${{ matrix.plat }}-dynamic${{ matrix.dynamic }}-metrics
        path: |
          _build/metrics/

  windows-native-foundation:
    if: ${{ inputs.qualification != 'linux-native' }}
    name: Windows native liblink foundation unit
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CABAL_DIR: "C:\\Users\\runneradmin\\AppData\\Roaming\\cabal"
      GHCUP_INSTALL_BASE_PREFIX: "C:\\"
      GHCUP_MSYS2: "C:/msys64"
      GHCUP_MSYS2_ENV: CLANG64
      MSYSTEM: CLANG64
      CHERE_INVOKING: 1
      GHC_VERSION: "9.8.4"
      CABAL_VERSION: "3.14.2.0"
      GHC_TARGETS: "install_bin install_lib update_package_db"
    defaults:
      run:
        shell: 'C:/msys64/usr/bin/bash.exe --login -e {0}'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Install MSYS2 CLANG64 dependencies
      run: |
        pacman --noconfirm -S --needed --overwrite '*' git vim winpty git tar bsdtar unzip binutils autoconf make xz curl libtool automake p7zip patch ca-certificates python3 zip mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-python-sphinx mingw-w64-clang-x86_64-python-requests mingw-w64-clang-x86_64-tools-git mingw-w64-clang-x86_64-ghostscript tar gzip

    - name: Install GHCup
      uses: haskell/ghcup-setup@v1
      with:
        cabal: ${{ env.CABAL_VERSION }}

    - name: Install GHC
      shell: pwsh
      run: ghcup --no-verbose install ghc --set --install-targets "${{ env.GHC_TARGETS }}" "${{ env.GHC_VERSION }}"

    - name: Build stage1
      timeout-minutes: 90
      run: |
        set -eo pipefail
        export PATH="/c/ghcup/bin:$PATH"
        mkdir -p _build/logs
        cabal update 2>&1 | tee _build/logs/windows-cabal-update.log
        make QUIET=1 DYNAMIC=0 CABAL_ARGS="-j2" stage1 2>&1 | tee _build/logs/windows-stage1.log

    - name: Build stage2
      timeout-minutes: 120
      run: |
        set -eo pipefail
        export PATH="/c/ghcup/bin:$PATH"
        test -f _build/cabal/bin/cabal.exe
        make QUIET=1 DYNAMIC=0 CABAL_ARGS="-j2" USE_SYSTEM_CABAL=1 stage2 2>&1 | tee _build/logs/windows-stage2.log

    - name: Run Windows foundation-only C unit
      run: |
        set -eo pipefail
        export PATH="/c/ghcup/bin:$PATH"
        python3 liblink/tests/unit/run_native_tests.py --foundation-only --cc clang 2>&1 | tee _build/logs/windows-liblink-foundation.log

    - name: Run Windows PE resolution C units
      timeout-minutes: 5
      run: |
        set -eo pipefail
        export PATH="/c/ghcup/bin:$PATH"
        python3 liblink/tests/unit/run_native_tests.py --pe-resolution-only --cc clang 2>&1 | tee _build/logs/windows-liblink-pe-resolution.log

    - name: Run Windows path ownership C unit
      timeout-minutes: 5
      run: |
        set -eo pipefail
        export PATH="/c/ghcup/bin:$PATH"
        python3 liblink/tests/unit/run_native_tests.py --path-ownership-only --cc clang 2>&1 | tee _build/logs/windows-liblink-path-ownership.log

    - name: Run Windows M32 reservation C unit
      timeout-minutes: 5
      run: |
        set -eo pipefail
        export PATH="/c/ghcup/bin:$PATH"
        python3 liblink/tests/unit/run_native_tests.py --windows-m32-only --cc clang 2>&1 | tee _build/logs/windows-liblink-m32.log

    - name: Run Windows focused linker testsuite
      timeout-minutes: 180
      run: |
        set -eo pipefail
        export PATH="/c/ghcup/bin:$PATH"
        bash .github/scripts/run-windows-focused-tests.sh

    - name: Upload Windows focused testsuite results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-focused-testsuite-results
        if-no-files-found: ignore
        path: |
          _build/logs/windows-focused/**
          _build/logs/windows-liblink-path-ownership.log
          _build/logs/windows-liblink-pe-resolution.log

    - name: Upload Windows build and unit logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: windows-native-foundation-logs
        if-no-files-found: ignore
        path: _build/logs/*.log
