# This is not perfect but it works ok
cradle:
  multi:
    - path: libraries/ghc-boot/Setup.hs
      config:
        cradle:
          direct:
            arguments:
              - -package Cabal
              - -package filepath
              - -package directory
              - -package ghc
    - path: .
      config:
        cradle:
          cabal:
            cabalProject: cabal.project.stage1
